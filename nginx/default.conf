server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow Google Sign-In popups to communicate back to the app
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
